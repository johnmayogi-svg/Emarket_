{% extends "shop/base.html" %}
{% load static %}

{% block content %}
<h2>Product Detail</h2>

<table class="product-table">
    <thead>
        <tr>
            <th>Image</th>
            <th>Name</th>
            <th>Description</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Add to Cart</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>
                {% if product.image %}
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="product-image">
                {% else %}
                    <img src="{% static 'images/no-image.png' %}" alt="No image available" class="product-image">
                {% endif %}
            </td>
            <td>{{ product.name }}</td>
            <td>{{ product.description }}</td>
            <td>${{ product.price }}</td>
            <td>

                <form method="post" class="cart-form">
                    {% csrf_token %}
                    <input type="number" name="quantity" value="1" min="1" class="quantity-input">
            </td>
            <td>
                    <button type="submit" class="btn add-cart-btn">Add to Cart</button>
                </form>
            </td>
        </tr>
    </tbody>
</table>

<!-- CSS for table layout -->
<style>
.product-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

.product-table th,
.product-table td {
    border: 1px solid #ddd;
    padding: 12px;
    text-align: center;
    vertical-align: middle;
}

.product-table th {
    background-color: #f8f8f8;
    font-weight: bold;
}

.product-image {
    max-width: 100px;
    height: auto;
    border-radius: 5px;
}

.quantity-input {
    width: 60px;
    padding: 5px;
    border-radius: 5px;
    border: 1px solid #ccc;
}

.btn {
    padding: 6px 12px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: #fff;
    font-size: 14px;
}

.add-cart-btn {
    background-color: #28a745;
}

.add-cart-btn:hover {
    background-color: #218838;
}
</style>
{% endblock %}
