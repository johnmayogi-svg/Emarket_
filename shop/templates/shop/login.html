
<div class="login-container" style="
    max-width: 400px;
    margin: 50px auto;
    background: #fff;
    border-radius: 8px;
    padding: 30px 25px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.1);
">
    <h2 style="text-align:center; color:#007bff; margin-bottom:20px;">Login to E-Market</h2>

    {% if form.errors %}
        <p style="background:#f8d7da; color:#721c24; padding:10px; border-radius:5px;">
            Invalid username or password.
        </p>
    {% endif %}

    <form method="post" style="display:flex; flex-direction:column; gap:15px;">
        {% csrf_token %}
        {{ form.username.label_tag }}
        {{ form.username }}

        {{ form.password.label_tag }}
        {{ form.password }}

        <input type="hidden" name="next" value="{{ next }}">

        <button type="submit" style="
            background:#007bff;
            color:white;
            padding:10px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:16px;
        ">Login</button>
    </form>

    <p style="margin-top:15px; text-align:center;">
        Don’t have an account?
        <a href="{% url 'register' %}" style="color:#007bff;">Register here</a>
    </p>
</div>
