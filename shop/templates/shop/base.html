{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Market</title>
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
    <style>
        /* ===== General ===== */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: #f4f6f8;
            color: #333;
        }
        a { text-decoration: none; color: inherit; }

        /* ===== Header ===== */
        header {
            background-color: #007bff;
            color: #fff;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        header h1 a {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        nav a {
            margin-left: 15px;
            color: #fff;
            font-weight: 500;
            transition: 0.3s;
        }
        nav a:hover { text-decoration: underline; }

        /* ===== Layout ===== */
        .container {
            display: flex;
            max-width: 1200px;
            margin: 30px auto;
            gap: 20px;
        }
        .sidebar {
            width: 250px;
            background: #fff;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #ddd;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .sidebar h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 20px;
            color: #007bff;
        }
        .sidebar a {
            display: block;
            padding: 8px 0;
            color: #007bff;
            font-weight: 500;
        }
        .sidebar a:hover { text-decoration: underline; }

        main { flex: 1; }

        /* ===== Footer ===== */
        footer {
            background: #007bff;
            color: white;
            padding: 15px 20px;
            text-align: center;
            margin-top: 40px;
            font-size: 14px;
        }

        /* ===== Product List in Main ===== */
        ul.products {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }
        ul.products li {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            width: 220px;
            text-align: center;
            box-shadow: 0 3px 8px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        ul.products li:hover { box-shadow: 0 6px 12px rgba(0,0,0,0.1); }
        ul.products li img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }
        ul.products li a.product-name {
            font-weight: bold;
            color: #007bff;
            display: block;
            margin-top: 5px;
        }

        /* ===== Buttons horizontally ===== */
        .product-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .btn {
            padding: 6px 12px;
            border-radius: 5px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .add-cart-btn {
            background-color: #28a745;
            color: #fff;
        }
        .add-cart-btn:hover { background-color: #218838; }
        .view-details-btn {
            background-color: #007bff;
            color: #fff;
            text-align: center;
            line-height: 24px;
        }
        .view-details-btn:hover { background-color: #0069d9; }
    </style>
</head>
<body>

<header>
    <h1><a href="{% url 'product_list' %}">E-Market</a></h1>
    <nav>
        <a href="{% url 'product_list' %}">Home</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <h3>Categories</h3>
        <a href="{% url 'product_list' %}">All Products</a>
        <a href="{% url 'cart' %}">My Cart</a>
        <a href="#">My Orders</a>
        <a href="#">Order Status</a>
    </aside>

    <!-- Main content -->
    <main>
        {% block content %}{% endblock %}
    </main>
</div>

<footer>
    <small>© 2025 E-Market. All rights reserved.</small>
</footer>

</body>
</html>
