{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simple E-Market</title>
    <link rel="stylesheet" href="{% static 'shop/css/style.css' %}">
    <style>
        /* ===== Body & Layout ===== */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background-color: #f8f9fa;
        }

        header {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        nav a:hover {
            text-decoration: underline;
        }

        /* ===== Sidebar ===== */
        .container {
            display: flex;
            margin: 20px auto;
            max-width: 1200px;
        }

        .sidebar {
            width: 250px;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-right: 20px;
        }

        .sidebar h3 {
            margin-top: 0;
        }

        .sidebar a {
            display: block;
            padding: 8px 0;
            color: #007bff;
            text-decoration: none;
        }

        .sidebar a:hover {
            text-decoration: underline;
        }

        /* ===== Main Content ===== */
        main {
            flex: 1;
        }

        ul.products {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        ul.products li {
            background: white;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            width: 200px;
            text-align: center;
        }

        ul.products li img {
            max-width: 100%;
            height: auto;
            margin-bottom: 10px;
        }

        ul.products li a {
            color: #007bff;
            font-weight: bold;
            text-decoration: none;
        }

        ul.products li a:hover {
            text-decoration: underline;
        }

        footer {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1><a href="{% url 'product_list' %}">E-Market</a></h1>
    <nav>
        <a href="{% url 'product_list' %}">Home</a>
        <a href="{% url 'cart' %}">Cart</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<div class="container">
    <!-- Sidebar -->
    <aside class="sidebar">
        <h3>Categories</h3>
        <a href="#">All Products</a>
        <a href="#">Electronics</a>
        <a href="#">Clothing</a>
        <a href="#">Books</a>
    </aside>

    <!-- Main content -->
    <main>
        {% block content %}{% endblock %}
    </main>
</div>

<footer>
    <small>Simple e-market example</small>
</footer>

</body>
</html>
